<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf4f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Morsel" />
  <title>Morsel — a delightful calorie tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="phone">
    <header id="topbar">
      <h1 id="brand">Morsel</h1>
      <nav id="viewSwitch" role="tablist" aria-label="View">
        <span id="switchThumb" aria-hidden="true"></span>
        <button id="tabChat" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>Chat</span>
        </button>
        <button id="tabJournal" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Journal</span>
        </button>
      </nav>
    </header>

    <!-- Sticky mini-summary: appears on the chat page once the full
         summary scrolls out of view, so the day's totals stay in sight. -->
    <div id="stickyBar" aria-hidden="true">
      <div class="sbTop">
        <span class="sbCal"><b id="sbNum">0</b><span class="sbGoal"> / <span id="sbGoalNum">2,000</span></span></span>
        <span class="sbMacros">
          <span class="sbM p"><i class="dot p"></i><span id="sbP">0g</span></span>
          <span class="sbM c"><i class="dot c"></i><span id="sbC">0g</span></span>
          <span class="sbM f"><i class="dot f"></i><span id="sbF">0g</span></span>
        </span>
      </div>
      <div class="sbTrack"><div id="sbFill"></div></div>
    </div>

    <!-- ── Chat view ─────────────────────────────────────────── -->
    <main id="chatView" class="view">
      <section id="daySummary">
        <p class="eyebrow" id="todayEyebrow"></p>
        <h2 class="dayTitle">Today</h2>
        <p id="bigTotal"><span id="totalNum">0</span><span class="goalPart">/ <button id="goalBtn" title="Tap to change your daily goal">2,000 cal</button></span></p>
        <div id="progressTrack"><div id="progressFill"></div></div>
        <div id="macroChips">
          <span class="chip p"><span class="mName"><i class="dot p"></i>Protein</span><b id="mP">0g</b><span class="mBar"><i id="bP"></i></span></span>
          <span class="chip c"><span class="mName"><i class="dot c"></i>Carbs</span><b id="mC">0g</b><span class="mBar"><i id="bC"></i></span></span>
          <span class="chip f"><span class="mName"><i class="dot f"></i>Fat</span><b id="mF">0g</b><span class="mBar"><i id="bF"></i></span></span>
        </div>
        <button id="clearDayBtn" class="ghostBtn" hidden>Clear today</button>
      </section>
      <section id="thread" aria-live="polite"></section>
      <div id="suggestions"></div>
    </main>

    <!-- ── Journal view ──────────────────────────────────────── -->
    <main id="journalView" class="view" hidden></main>

    <!-- ── Composer ──────────────────────────────────────────── -->
    <footer id="composer">
      <form id="logForm" autocomplete="off">
        <input id="logInput" type="text" placeholder="What did you eat?" maxlength="500" />
        <button id="sendBtn" type="submit" aria-label="Log it">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- ── Goal sheet ────────────────────────────────────────────── -->
  <div id="goalSheet" hidden>
    <div class="sheetBackdrop"></div>
    <div class="sheetCard" role="dialog" aria-modal="true" aria-label="Set your daily calorie goal">
      <div class="sheetHandle"></div>
      <h2 class="sheetTitle">Your daily goal</h2>
      <p class="sheetSub">Let Morsel estimate a target from a few details, or set your own number.</p>

      <div class="calc">
        <div class="field">
          <label>Sex <span class="hint">(for the formula)</span></label>
          <div class="seg" id="gSex">
            <button type="button" data-v="female">Female</button>
            <button type="button" data-v="male">Male</button>
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label>Age</label>
            <input id="gAge" type="number" inputmode="numeric" min="13" max="100" placeholder="30" />
          </div>
          <div class="field">
            <label>Units</label>
            <div class="seg" id="gUnits">
              <button type="button" data-v="imperial">lb / ft</button>
              <button type="button" data-v="metric">kg / cm</button>
            </div>
          </div>
        </div>

        <div class="row2">
          <div class="field" id="fieldHeightImp">
            <label>Height</label>
            <div class="inline">
              <input id="gFt" type="number" inputmode="numeric" min="3" max="8" placeholder="5" /><span class="u">ft</span>
              <input id="gIn" type="number" inputmode="numeric" min="0" max="11" placeholder="9" /><span class="u">in</span>
            </div>
          </div>
          <div class="field" id="fieldHeightMet" hidden>
            <label>Height</label>
            <div class="inline"><input id="gCm" type="number" inputmode="numeric" min="120" max="230" placeholder="175" /><span class="u">cm</span></div>
          </div>
          <div class="field">
            <label>Weight</label>
            <div class="inline"><input id="gWeight" type="number" inputmode="decimal" placeholder="160" /><span class="u" id="gWeightU">lb</span></div>
          </div>
        </div>

        <div class="field">
          <label>Activity level</label>
          <select id="gActivity">
            <option value="1.2">Mostly sitting, little exercise</option>
            <option value="1.375">Light — exercise 1–3 days/week</option>
            <option value="1.55" selected>Moderate — exercise 3–5 days/week</option>
            <option value="1.725">Active — exercise 6–7 days/week</option>
            <option value="1.9">Very active — hard training or physical job</option>
          </select>
        </div>

        <div class="field">
          <label>Goal</label>
          <div class="seg seg3" id="gDir">
            <button type="button" data-v="lose">Lose</button>
            <button type="button" data-v="maintain">Maintain</button>
            <button type="button" data-v="gain">Gain</button>
          </div>
        </div>

        <div class="field" id="fieldRate" hidden>
          <label id="rateLabel">Pace</label>
          <div class="seg seg3" id="gRate">
            <button type="button" data-v="0.5">½ lb / wk</button>
            <button type="button" data-v="1">1 lb / wk</button>
            <button type="button" data-v="1.5">1½ lb / wk</button>
          </div>
        </div>

        <div class="calcResult">
          <div class="calcNumWrap"><span class="calcNum" id="gRec">—</span><span class="calcUnit">cal / day</span></div>
          <p class="calcNote" id="gNote">Fill in the details above and I'll suggest a target.</p>
        </div>
        <button type="button" class="bigBtn" id="gUseRec">Use this target</button>
      </div>

      <div class="orDiv"><span>or set it yourself</span></div>
      <div class="manualRow">
        <input id="gManual" type="number" inputmode="numeric" min="500" max="10000" placeholder="2,000" />
        <span class="u">cal</span>
        <button type="button" class="bigBtn ghost" id="gUseManual">Save</button>
      </div>

      <button type="button" class="sheetClose" id="gClose">Close</button>
    </div>
  </div>

  <div id="burstLayer" aria-hidden="true"></div>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
