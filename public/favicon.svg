<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="34%" cy="24%" r="90%">
      <stop offset="0%" stop-color="#2a1424"/>
      <stop offset="55%" stop-color="#1a0e18"/>
      <stop offset="100%" stop-color="#120a10"/>
    </radialGradient>
    <radialGradient id="glowA" cx="28%" cy="20%" r="55%">
      <stop offset="0%" stop-color="rgba(255,78,128,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,78,128,0)"/>
    </radialGradient>
    <radialGradient id="glowB" cx="84%" cy="88%" r="52%">
      <stop offset="0%" stop-color="rgba(255,120,90,0.42)"/>
      <stop offset="100%" stop-color="rgba(255,120,90,0)"/>
    </radialGradient>
    <radialGradient id="glowC" cx="90%" cy="22%" r="48%">
      <stop offset="0%" stop-color="rgba(226,60,160,0.55)"/>
      <stop offset="100%" stop-color="rgba(226,60,160,0)"/>
    </radialGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd0dc"/>
      <stop offset="42%" stop-color="#ff86a4"/>
      <stop offset="100%" stop-color="#ff2f63"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- rounded-square canvas + aurora -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowA)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowB)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowC)"/>

  <!-- top gloss sits UNDER the monogram so the M stays crisp -->
  <rect x="10" y="10" width="492" height="226.32000000000002" rx="104" fill="url(#gloss)" opacity="0.6"/>

  <!-- the M monogram, editorial serif -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="366" fill="url(#m)" filter="url(#soft)"
        style="letter-spacing:-8px">M</text>

  <!-- hairline rim -->
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none"
        stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
</svg>