name: Deploy Morsel to GitHub Pages

on:
  push:
    branches: [claude/calorie-tracker-nano-banana-5usb2r]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build single-file app
        run: |
          node scripts/build-demo.js
          mkdir -p _site
          cp dist/* _site/
          mv _site/morsel.html _site/index.html
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
